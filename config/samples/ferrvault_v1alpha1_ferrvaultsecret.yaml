apiVersion: ferrvault.com/v1alpha1
kind: FerrVaultSecret
metadata:
  name: api-credentials
  namespace: my-app
spec:
  connectionRef:
    name: ferrvault-prod
  project: my-app
  vault: production
  selector:
    names:
      - DATABASE_URL
      - STRIPE_API_KEY
  target:
    name: api-credentials
  refreshInterval: 30m
  rolloutRestart:
    - kind: Deployment
      name: api
