# Sample `FerrFlowConnection` targeting the new FerrVault SaaS shape.
#
# Differences from the default `ferrflow` mode:
#
#   - `mode: ferrvault`                — required to flip the controller to
#                                        the `/v1/operator/secrets/reveal`
#                                        endpoint
#   - `tokenSecretRef.key`             — must hold a Service-Account Token
#                                        (`sat_…`) minted from the FerrVault
#                                        app at `app.ferrvault.com/vaults/<slug>/k8s`
#   - `organization` is required by the CRD for now but **ignored** by the
#     controller in `ferrvault` mode — the SAT already binds to a vault
#
# Reference a `FerrFlowSecret` to this connection and set `spec.vault` to the
# slug the SAT was minted against. `spec.project` is also ignored.
apiVersion: ferrflow.io/v1alpha1
kind: FerrFlowConnection
metadata:
  name: ferrvault-prod
  namespace: my-app
spec:
  mode: ferrvault
  url: https://ferrvault.com
  organization: my-org
  tokenSecretRef:
    name: ferrvault-sat
    key: token
