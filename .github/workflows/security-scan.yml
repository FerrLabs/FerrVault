name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Secrets + CVE
    uses: FerrLabs/.github/.github/workflows/reusable-security-scan.yml@7c51d18aedc7e04f1a8360e68c0c0933fd773ac0 # main
    with:
      run-on-private: true
    secrets: inherit
