name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Secrets + CVE
    uses: FerrLabs/.github/.github/workflows/reusable-security-scan.yml@c2ba2d8915572bebd539fa5ba7ec4219bfc02f18 # main
    with:
      run-on-private: true
    secrets: inherit
