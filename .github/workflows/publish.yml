name: Publish

# Runs FerrFlow's docker + helm publishers (ferrflow.publish.json) after
# FerrFlow cuts a release tag on main. The release job only versions and
# tags; publishing lives here, where the build toolchain (buildx, helm)
# and GHCR auth are set up — the toolchain the minimal release runner
# doesn't carry. `ferrflow publish` resolves the released version from the
# git tag and runs each publisher idempotently.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  FERRFLOW_CONFIG: ferrflow.publish.json

jobs:
  publish:
    name: Image + chart
    # Skip the rolling major-only tag (e.g. `v4`) if one is ever created —
    # the exact-version tag already published this version.
    if: github.event_name == 'workflow_dispatch' || contains(github.ref_name, '.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stamp chart version + appVersion with the release version
        # go.mod uses tag-derived versioning, so Chart.yaml carries no
        # committed version for FerrFlow to bump. Stamp it from the release
        # tag here so `helm package` produces the right `…-<version>.tgz`,
        # keeping chart `version` and `appVersion` in lock-step.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "Stamping chart with version $V"
          sed -i -E "s/^version: .*/version: \"$V\"/" charts/ferrvault-operator/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"$V\"/" charts/ferrvault-operator/Chart.yaml
      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: v3.21.0
      - name: Log in to GHCR for helm push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: FerrLabs/FerrFlow@96c29d20c1f96ce4751b012d8c31915e2baf2e3c # v5.9.0
        with:
          mode: publish
