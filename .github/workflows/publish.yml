name: Publish

# Runs the docker + helm publishers declared in `.ferrflow` after FerrFlow
# cuts a release tag on main. `.ferrflow` carries `deferPublish: true`, so
# the release job only versions and tags — publishing lives here, where the
# build toolchain (buildx, helm) and GHCR auth are set up. `ferrflow publish`
# resolves the released version from the git tag and runs each publisher
# idempotently.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Image + chart
    # Skip the rolling major-only tag (e.g. `v4`) if one is ever created —
    # the exact-version tag already published this version.
    if: github.event_name == 'workflow_dispatch' || contains(github.ref_name, '.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stamp chart version + appVersion with the release version
        # go.mod uses tag-derived versioning, so Chart.yaml carries no
        # committed version for FerrFlow to bump. Stamp it from the release
        # tag here so `helm package` produces the right `…-<version>.tgz`,
        # keeping chart `version` and `appVersion` in lock-step.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "Stamping chart with version $V"
          sed -i -E "s/^version: .*/version: \"$V\"/" charts/ferrvault-operator/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"$V\"/" charts/ferrvault-operator/Chart.yaml
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.3
      - name: Log in to GHCR for helm push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - uses: FerrLabs/FerrFlow@d4f48a7986df6be38bc560ec7da4014339132ba4 # v7.0.0
        with:
          mode: publish
