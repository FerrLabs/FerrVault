name: Fuzz

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzApplyTransforms
            package: ./internal/controller
          - target: FuzzHashSecretData
            package: ./internal/controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Fuzz
        run: go test -run='^$' -fuzz="^${{ matrix.target }}\$" -fuzztime=300s ${{ matrix.package }}

      - name: Failing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-testdata-${{ matrix.target }}
          path: internal/controller/testdata/fuzz
          if-no-files-found: ignore
          retention-days: 30
