name: cli-release

on:
  push:
    tags:
      - 'cli-v[0-9]+.[0-9]+.[0-9]+'
      - 'cli-v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: taiki-e/create-gh-release-action@v1
        with:
          prefix: cli
          title: ferrvault CLI $version
          token: ${{ secrets.GITHUB_TOKEN }}

  upload:
    name: Build and upload (${{ matrix.short }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            short: linux-amd64
            tool: cargo
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            short: linux-arm64
            tool: cross
          - target: x86_64-apple-darwin
            os: macos-latest
            short: darwin-amd64
            tool: cargo
          - target: aarch64-apple-darwin
            os: macos-latest
            short: darwin-arm64
            tool: cargo
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            short: windows-amd64
            tool: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install Linux deps for keyring (native builds only — cross uses Cross.toml)
        if: runner.os == 'Linux' && matrix.tool == 'cargo'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.96'
          targets: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ferrvault
          target: ${{ matrix.target }}
          tool: ${{ matrix.tool }}
          archive: ferrvault-${{ matrix.short }}
          checksum: sha256
          tar: unix
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest binary provenance (SLSA)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: target/${{ matrix.target }}/release/ferrvault
