name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not push tags or releases)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: FerrLabs/.github/.github/workflows/reusable-ferrflow-release.yml@15286b37e14c898251a98ea18d21b69ab0bf777f # main
    with:
      dry-run: ${{ inputs.dry_run || false }}
    secrets:
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      FERRLABS_DISPATCH_TOKEN: ${{ secrets.FERRLABS_DISPATCH_TOKEN }}
