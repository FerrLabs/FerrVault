name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not push tags or releases)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: FerrLabs/.github/.github/workflows/reusable-ferrflow-release.yml@7c51d18aedc7e04f1a8360e68c0c0933fd773ac0 # main
    with:
      dry-run: ${{ inputs.dry_run || false }}
    secrets:
      FERRLABS_DISPATCH_TOKEN: ${{ secrets.FERRLABS_DISPATCH_TOKEN }}
