name: MCP CI

on:
  push:
    branches: [main]
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mcp/**"
      - ".github/workflows/mcp-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    permissions:
      contents: read
      pull-requests: write
      packages: read
    name: Test
    uses: FerrLabs/.github/.github/workflows/reusable-ci-node.yml@be40b72b4ed5d23c0b5023063417211548729eaf # main
    with:
      working-directory: mcp
      node-version: "24"
      pnpm-version: "12"
      enable-sonar: true
      sonar-project-key: FerrVault-MCP
      install-args: ""
      enable-lint: false
      enable-knip: true
      enable-madge: true
      madge-paths: packages/*/src
      enable-audit: true
    secrets: inherit
