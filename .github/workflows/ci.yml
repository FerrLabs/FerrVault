name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@c2ba2d8915572bebd539fa5ba7ec4219bfc02f18 # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
