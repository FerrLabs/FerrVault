name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@40aa5d1770444d993bc9f681019f8cc0fe597fd8 # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
