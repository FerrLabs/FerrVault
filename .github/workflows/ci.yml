name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@15286b37e14c898251a98ea18d21b69ab0bf777f # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
