name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@7c51d18aedc7e04f1a8360e68c0c0933fd773ac0 # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
