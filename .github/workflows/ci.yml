name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@3e9da8839a560658f766667fa6d5fd9496c5cd21 # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
