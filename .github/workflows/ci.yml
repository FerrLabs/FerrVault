name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@c3212b1ccc78233fd9fec4f87128906c82c79995 # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
