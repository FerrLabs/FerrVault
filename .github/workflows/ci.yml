name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@be40b72b4ed5d23c0b5023063417211548729eaf # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
