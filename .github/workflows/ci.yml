name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@1a21d234ca6b171eaccf47d029520724e15e406c # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
