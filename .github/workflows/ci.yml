name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@dc37316d0b31cb7a47455f2933202533f9c909bd # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
