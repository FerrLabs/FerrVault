name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@532e765d8b055d300bc2beeff3c981ed2938759f # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
