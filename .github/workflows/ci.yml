name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@84f44470a9ff640ea8bb32efc74d45f912660d71 # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
