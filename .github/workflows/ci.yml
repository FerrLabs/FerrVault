name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: write
    name: CI
    uses: FerrLabs/.github/.github/workflows/reusable-ci-go.yml@9de9605743021dfff54158707936cc57bedd4360 # main
    with:
      build-paths: ./cmd/...
      enable-sonar: true
    secrets: inherit
