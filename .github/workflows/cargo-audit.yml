name: cargo-audit

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/cargo-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cli/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/cargo-audit.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: RUSTSEC audit
    runs-on: ferrlabs-k8s
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain (stable, for cargo-audit tool itself)
        uses: dtolnay/rust-toolchain@stable
      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
