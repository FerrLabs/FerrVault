apiVersion: v2
name: ferrvault-operator
description: Kubernetes operator that syncs secrets from the FerrVault API into native Kubernetes Secrets.
type: application

# `version` is the chart's own version (bumped on chart-only changes).
# `appVersion` mirrors the operator binary version — both are kept in sync
# automatically on every release of this repo.
version: "0.1.0"
appVersion: "0.1.0"

kubeVersion: ">=1.28.0-0"

home: https://ferrvault.com
sources:
  - https://github.com/FerrLabs/FerrVault
keywords:
  - ferrvault
  - secrets
  - secret-management
  - external-secrets
  - kubernetes-operator

maintainers:
  - name: FerrVault
    url: https://ferrvault.com

annotations:
  artifacthub.io/license: MPL-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://ferrvault.com/docs
    - name: Source
      url: https://github.com/FerrLabs/FerrVault
