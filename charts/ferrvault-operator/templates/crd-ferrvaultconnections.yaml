{{- if .Values.crds.install -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crds.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
  labels:
    {{- include "ferrvault-operator.labels" . | nindent 4 }}
  name: ferrvaultconnections.ferrvault.com
spec:
  group: ferrvault.com
  names:
    kind: FerrVaultConnection
    listKind: FerrVaultConnectionList
    plural: ferrvaultconnections
    singular: ferrvaultconnection
    shortNames:
      - fvc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: URL
          type: string
          jsonPath: .spec.url
        - name: Org
          type: string
          jsonPath: .spec.organization
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              required: [url]
              x-kubernetes-validations:
                - rule: "self.mode != 'cloud' || (has(self.organization) && self.organization != '')"
                  message: "organization is required when mode is cloud"
              properties:
                mode:
                  type: string
                  enum: [cloud, ferrvault]
                  default: ferrvault
                  description: |
                    Backend API the operator talks to. For `FerrVaultConnection`,
                    `ferrvault` is the natural default — flat
                    `/v1/operator/secrets/reveal` shape with a SAT token. Set to
                    `cloud` only for legacy FerrLabs-Cloud reveal paths.
                url:
                  type: string
                  pattern: '^https?://'
                  description: Base URL of the FerrVault API (without trailing slash).
                organization:
                  type: string
                  description: FerrVault org slug. Required when mode=cloud; ignored when mode=ferrvault (SAT scopes the request).
                tokenSecretRef:
                  type: object
                  required: [name, key]
                  properties:
                    name: { type: string }
                    key:  { type: string }
                oidc:
                  type: object
                  required: [clusterID]
                  properties:
                    clusterID:
                      type: string
                      pattern: '^[0-9a-fA-F-]{36}$'
                    tokenPath: { type: string }
                    audience:  { type: string }
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:               { type: string }
                      status:             { type: string, enum: ["True", "False", "Unknown"] }
                      observedGeneration: { type: integer, format: int64 }
                      lastTransitionTime: { type: string, format: date-time }
                      reason:             { type: string }
                      message:            { type: string }
                lastCheckedAt:
                  type: string
                  format: date-time
{{- end }}
