{{- if and .Values.rbac.create (not .Values.watchNamespace) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ferrvault-operator.fullname" . }}
  labels:
    {{- include "ferrvault-operator.labels" . | nindent 4 }}
rules:
  {{- include "ferrvault-operator.rules" . | nindent 2 }}
  {{- if .Values.leaderElection.enabled }}
  {{- include "ferrvault-operator.leaseRules" . | nindent 2 }}
  {{- end }}
{{- end }}
