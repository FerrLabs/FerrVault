{{- if and .Values.rbac.create .Values.watchNamespace -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ferrvault-operator.fullname" . }}
  namespace: {{ .Values.watchNamespace }}
  labels:
    {{- include "ferrvault-operator.labels" . | nindent 4 }}
rules:
  {{- include "ferrvault-operator.rules" . | nindent 2 }}
  {{- if and .Values.leaderElection.enabled (eq .Values.watchNamespace .Release.Namespace) }}
  {{- include "ferrvault-operator.leaseRules" . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ferrvault-operator.fullname" . }}
  namespace: {{ .Values.watchNamespace }}
  labels:
    {{- include "ferrvault-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ferrvault-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ferrvault-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if and .Values.leaderElection.enabled (ne .Values.watchNamespace .Release.Namespace) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ferrvault-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ferrvault-operator.labels" . | nindent 4 }}
rules:
  {{- include "ferrvault-operator.leaseRules" . | nindent 2 }}
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ferrvault-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ferrvault-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ferrvault-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "ferrvault-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
